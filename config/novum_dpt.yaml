

workers: 4
save_dir: "/data/lmbraid21/jesslen/NOVUM/results"
overwrite: false
dataset:
  paths:
    root: "/data/lmbraid21/jesslen/Pascal3DforNeMo/dataOld" # TODO: change this 
    training: "Classification_PASCAL3D_train_NeMo"
    eval_iid: "Classification_PASCAL3D_NeMo"
    eval_ood: "Classification_PASCAL3D_OCC_NeMo"
    imgs: "images"
    img_list: "lists3D_single" # can be anything except "lists"
    annot: "annotations3D_single" # can be anything except "annotations"
    mesh: "PASCAL3D+_release1.1/CAD_single"

  class_name: dataset.Pascal3DPlus
  distance: 5.0
  weighted: true
  image_size:
    - 640
    - 800
  occlusion_levels: 
    - ""
    - "FGL1_BGL1"
    - "FGL2_BGL2"
    - "FGL3_BGL3"
  classes:
    - "aeroplane"
    - "bicycle"
    - "boat"
    - "bottle"
    - "bus"
    - "car"
    - "chair"
    - "diningtable"
    - "motorbike"
    - "sofa"
    - "train"
    - "tvmonitor"
  required_annotations:
    - "azimuth"
    - "elevation"
    - "distance"
    - "focal"
    - "theta"
    - "principal"
    - "viewport"
    - "height"
    - "width"
    - "cad_index"
    - "bbox"

model:
  backbone:
      type: "dinov2"
      arch: "vitb14"
      output: "dense"
      freeze: true
      last_upscaling: false # if true, down_sample_rate = 1
  num_noise: 5
  max_group: 512
  d_feature: 128
  local_size: 1
  ckpt: "/data/lmbraid21/jesslen/Pascal3DforNeMo/dataOld/expClassification/2025-04-03/dinov2DPT/dinov2_vitb16.pth" 
  down_sample_rate: 2


training:
  batch_size: 32
  total_epochs: 200
  distance_thr: 48 # TODO: would be interesting to change 
  T: 0.07
  weight_noise: 0.005
  update_lr_epoch_n: 10
  update_lr_: 0.2
  lr: 0.0001
  adj_momentum: 0.9
  accumulate: 10
  weight_decay: 0.0001
  separate_bank: false

inference:
  batch_size: 1
  occlusion: ""  # can be "", "FGL1_BGL1", "FGL2_BGL2", "FGL3_BGL3"
  use_clutter: false
  mask_out_padded: true
  render_and_compare:
    epochs: 30
    lr: 0.05
    adam_beta_0: 0.4
    adam_beta_1: 0.6
  